<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<!-- Makes Add-to-Home-Screen behave like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!-- iPad status bar -->
<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<!-- Name shown by iPad -->
<meta name="apple-mobile-web-app-title"
      content="My App">

<!-- Home Screen icon -->
<link rel="apple-touch-icon" href="icon.png">

<title>My App</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: white;

    /* Prevent text selection */
    -webkit-user-select: none;
    user-select: none;

    /* Natural iPad scrolling */
    -webkit-overflow-scrolling: touch;
}

body {
    overflow-x: hidden;
}

#app-screen {
    display: block;
    width: 100%;
    height: auto;

    /* Prevent image dragging */
    -webkit-user-drag: none;
    user-drag: none;

    pointer-events: none;
}

</style>
</head>

<body>

<img
    id="app-screen"
    src="screen.jpg"
    alt=""
    draggable="false"
>

<script>

/* Prevent context menu from long press */
document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
});

/* Prevent dragging */
document.addEventListener("dragstart", function(e) {
    e.preventDefault();
});

</script>

</body>
</html>
